services:
  scout:
    build: .
    image: scout-agent:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SCOUT_DB_PATH: /app/data/scout.db
      SCOUT_CORPUS_DIR: /app/corpus
      SCOUT_INDEX_DIR: /app/corpus/index
      SCOUT_STATIC_DIR: /app/static
      SCOUT_REPORTS_DIR: /app/reports
      SCOUT_REQUIRE_AUTH: "false"
      SCOUT_SANDBOX_BACKEND: disabled
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
