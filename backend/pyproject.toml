[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-agent"
version = "0.1.0"
description = "Scout: a citation-first AI technology research agent."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "mypy==2.4.1",
]
corpus = ["beautifulsoup4>=4.12"]
embed = ["fastembed>=0.3"]
gui = ["playwright>=1.40"]

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
